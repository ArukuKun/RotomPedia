name: Verify RotomPedia
on:
  push:
    branches: ['feature/v3.4-*', 'feature/v3.5-*']
  pull_request:
    branches: [Main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/generate_pokemon_index.py --verify-only
      - run: python tools/generate_item_index.py --verify-only
      - run: python tools/generate_reference_index.py --verify-only
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x RotomPedia/gradlew
      - name: Unit, SQLite migration, lint and APK checks
        working-directory: RotomPedia
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RotomPedia-test-reports
          path: |
            RotomPedia/app/build/reports/tests/
            RotomPedia/app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: RotomPedia-validation-only
          path: RotomPedia/app/build/outputs/apk/debug/app-debug.apk
  publish-prepared:
    name: Publish Verified Draft (manual recovery)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: RotomPedia-validation-only
          path: RotomPedia/app/build/outputs/apk/debug
      - name: Resolve existing test tag without changing its app source
        id: prepared
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' RotomPedia/app/build.gradle.kts)
          TAG="v${VERSION}"
          git rev-parse --verify "refs/tags/$TAG"
          git diff --exit-code "$TAG" HEAD -- RotomPedia tools
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish only compatible verified pre-release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.prepared.outputs.tag }}
        run: bash .github/scripts/publish-prerelease.sh
