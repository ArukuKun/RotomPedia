name: Verify RotomPedia
on:
  push:
    branches: ['feature/v3.4-*', 'feature/v3.5-*']
  pull_request:
    branches: [Main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/generate_pokemon_index.py --verify-only
      - run: python tools/generate_item_index.py --verify-only
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x RotomPedia/gradlew
      - name: Unit, SQLite migration, lint and APK checks
        working-directory: RotomPedia
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RotomPedia-test-reports
          path: |
            RotomPedia/app/build/reports/tests/
            RotomPedia/app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: RotomPedia-validation-only
          path: RotomPedia/app/build/outputs/apk/debug/app-debug.apk
