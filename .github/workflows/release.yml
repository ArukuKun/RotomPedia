name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./RotomPedia/gradlew

      - name: Build Debug APK
        working-directory: ./RotomPedia
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Prepare APK Asset for Release
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          echo "Preparing release APK for tag: ${VERSION_TAG}"
          ls -la ./RotomPedia/app/build/outputs/apk/debug/
          cp ./RotomPedia/app/build/outputs/apk/debug/app-debug.apk "./RotomPedia-${VERSION_TAG}.apk"
          cp ./RotomPedia/app/build/outputs/apk/debug/app-debug.apk "./RotomPedia-latest.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "RotomPedia ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            ./RotomPedia-${{ github.ref_name }}.apk
            ./RotomPedia-latest.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Entrega de validación v3.4-A: persistencia Room v7 sin migraciones destructivas, aislamiento por usuario, repositorio compartido e índice nacional generado desde PokeAPI.

            Incluye únicamente el hito A. No incorpora la interfaz, filtros ni sprites previstos para B/C. Pendiente de validación del usuario en Android.

            APK debug firmado con clave de desarrollo. Si Android indica firma incompatible, no desinstales la aplicación para forzar la instalación sin respaldar antes los datos. Tras migrar a Room v7, no vuelvas a instalar una versión anterior sobre esos datos.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
