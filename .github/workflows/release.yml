name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    name: Verify Tagged APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./RotomPedia/gradlew

      - name: Build Debug APK
        working-directory: ./RotomPedia
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      # The runner uses an ephemeral debug key. Its APK is a CI artifact only.
      # Publish the verified, update-compatible APK + checksum explicitly with gh:
      # test milestones/RC -> prerelease; approved X.Y.0 base -> normal release.
      - name: Retain CI APK (not an installation update)
        uses: actions/upload-artifact@v4
        with:
          name: RotomPedia-tag-validation-only
          path: RotomPedia/app/build/outputs/apk/debug/app-debug.apk
