name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Verify Tag and Publish Prepared Pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./RotomPedia/gradlew

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify bundled data and generator tests
        run: |
          python -m unittest discover -s tools/tests -v
          python tools/generate_pokemon_index.py --verify-only
          python tools/generate_item_index.py --verify-only
          python tools/generate_reference_index.py --verify-only
          python tools/generate_location_index.py --verify-only RotomPedia/app/src/main/assets/hoenn-emerald-location-pilot.json

      - name: Build Debug APK
        working-directory: ./RotomPedia
        # Match local verification and avoid competing Compose/lint/build tasks on small runners.
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace --max-workers=1

      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RotomPedia-release-test-reports
          path: |
            RotomPedia/app/build/reports/tests/
            RotomPedia/app/build/test-results/testDebugUnitTest/
            RotomPedia/app/build/reports/lint-results-debug.*

      # The runner's ephemeral debug key must never replace the installable APK.
      # A compatible, locally signed APK + checksum must already exist in a draft.
      - name: Retain CI APK (not an installation update)
        uses: actions/upload-artifact@v4
        with:
          name: RotomPedia-tag-validation-only
          path: RotomPedia/app/build/outputs/apk/debug/app-debug.apk

      # Only a pre-release tag can publish; workflow_dispatch from a branch must stay verification-only.
      - name: Verify compatible signed assets and publish pre-release only
        if: ${{ startsWith(github.ref_name, 'v') && contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          bash .github/scripts/publish-prerelease.sh
