name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./RotomPedia/gradlew

      - name: Build Debug APK
        working-directory: ./RotomPedia
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          cp ./RotomPedia/app/build/outputs/apk/debug/app-debug.apk "./RotomPedia/app/build/outputs/apk/debug/RotomPedia-${VERSION_TAG}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "RotomPedia ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: ./RotomPedia/app/build/outputs/apk/debug/RotomPedia-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
