name: National index candidate
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/pokeapi-index
          key: pokemon-index-${{ github.run_id }}
          restore-keys: pokemon-index-
      - run: python -m unittest discover -s tools/tests
      - run: python tools/generate_pokemon_index.py --output candidate/pokemon-index.json --previous RotomPedia/app/src/main/assets/pokemon-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-index-candidate
          path: candidate/pokemon-index.json
