# RotomPedia Backend - Configuración autónoma (sin Laragon / MySQL externo)
spring.application.name=rotompediabackend

# === BASE DE DATOS H2 EN MEMORIA (sin dependencias externas) ===
spring.datasource.url=jdbc:h2:mem:rotompediadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === CONSOLA H2 (solo para desarrollo local) ===
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === SERVIDOR ===
server.port=8080

# === LOGGING ===
logging.level.root=WARN
logging.level.com.duoc=INFO
